<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c2352">
<title>Biqbaq: you're offline</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f4ee; color: #1b1f2b; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 26rem; padding: 2rem 1.5rem; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 22px; }
  h1 { margin: 1.25rem 0 0.5rem; font-size: 1.6rem; color: #0c2352; }
  p { margin: 0 0 1rem; line-height: 1.5; color: #5b6475; }
  button { margin-top: 0.5rem; border: 0; border-radius: 12px; background: #d01d21; color: #fff; font: inherit; font-weight: 700; padding: 0.8rem 1.4rem; cursor: pointer; }
  .fr { margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid #e6e1d8; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Biqbaq">
  <h1>You're offline</h1>
  <p>Biqbaq needs an internet connection. Check your connection, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
  <div class="fr" lang="fr">
    <p><strong>Vous êtes hors ligne.</strong> Biqbaq a besoin d'une connexion Internet. Vérifiez votre connexion, puis réessayez.</p>
  </div>
</main>
</body>
</html>
